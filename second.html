<!DOCTYPE html>
<html>
    <head>
        <title>Formatting tags</title>
    </head>
    <body>
        <h2>Formatting Tags</h2>
        <p><i>This is italic text.</i></p>
        <p><u>This is underlined text.</u></p>
        <p><strong>This is bold text.</strong></p>
        <p><em>This is emphasized text.</em></p>
        <hr>
        <p>thankyou</p>
    </body>
</html>
